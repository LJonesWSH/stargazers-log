<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stargazers Log</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">A personal collection</p>
        <h1>Stargazers log</h1>
        <p class="intro">A log of the repositories I've starred.</p>
      </header>
      <section aria-label="Starred repositories">
        <p id="list-status" class="status" role="status">Loading repositories...</p>
        <ul id="repository-list" aria-live="polite"></ul>
      </section>
    </main>
  </body>
</html>
